name: fix-game-runtime
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'enesfaruktkccc'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game flow and image proxy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');document.querySelectorAll('[data-screen]').forEach(x=>x.classList.toggle('active',x.dataset.screen===b.dataset.screen))});"
          new="""document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{
            const target=b.dataset.screen;
            if(target==='game' && !profile){openAccount();return;}
            document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
            document.getElementById(target).classList.add('active');
            document.querySelectorAll('[data-screen]').forEach(x=>x.classList.toggle('active',x.dataset.screen===target));
            if(target==='game' && !current)pick();
          });"""
          if old not in s: raise SystemExit('navigation block not found')
          s=s.replace(old,new,1)
          old2="async function loadImage(){const img=document.getElementById('playerPhoto');const fb=document.getElementById('fallbackPlayer');img.style.display='none';fb.style.display='grid';try{const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(current.name.replace(/\\s+/g,'_')));if(!r.ok)throw 0;const d=await r.json();if(!d.thumbnail?.source)throw 0;img.onload=()=>{fb.style.display='none';img.style.display='block'};img.src=d.thumbnail.source}catch(e){}}"
          new2="""async function loadImage(){const img=document.getElementById('playerPhoto');const fb=document.getElementById('fallbackPlayer');const status=document.getElementById('imageStatus');img.style.display='none';fb.style.display='grid';if(!current)return;if(status)status.textContent='GÖRSEL YÜKLENİYOR...';try{const r=await fetch('/api/player-image?name='+encodeURIComponent(current.name));if(!r.ok)throw 0;const d=await r.json();if(!d.url)throw 0;img.onload=()=>{fb.style.display='none';img.style.display='block'};img.onerror=()=>{if(status)status.textContent='GÖRSEL BULUNAMADI'};img.src=d.url}catch(e){if(status)status.textContent='GÖRSEL BULUNAMADI'}}"""
          if old2 not in s: raise SystemExit('loadImage block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          p=Path('server.js')
          s=p.read_text(encoding='utf-8')
          marker="app.use(express.static(__dirname));"
          endpoint="""app.get('/api/player-image', async (req, res) => {
            const name = clean(req.query?.name, 120);
            if (!name) return res.status(400).json({ error: 'name required' });
            try {
              const url = 'https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(name.replace(/\\s+/g, '_'));
              const r = await fetch(url, { headers: { 'User-Agent': 'FutbolcuyuBil/1.0' } });
              if (!r.ok) return res.status(404).json({ error: 'image not found' });
              const d = await r.json();
              if (!d.thumbnail?.source) return res.status(404).json({ error: 'image not found' });
              res.json({ url: d.thumbnail.source });
            } catch (e) {
              console.error('player image proxy error', e);
              res.status(502).json({ error: 'image lookup failed' });
            }
          });

          """ + marker
          if marker not in s: raise SystemExit('server marker not found')
          s=s.replace(marker,endpoint,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html server.js
          git diff --cached --quiet || git commit -m 'fix game navigation, image loading, and question flow'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-game-runtime.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'remove temporary game fix workflow' || true
          git push || true
